name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  schema-load:
    # Day-1 Exit gate: schema.sql loads 45/45 into a FRESH EMPTY ephemeral
    # Postgres, and the destructive DEV-RESET preamble stays commented in git.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGURL: postgres://postgres:postgres@localhost:5432/postgres
      SCHEMA: .claude/backend/schema.sql
      EXPECTED_TABLES: '45'
    steps:
      - uses: actions/checkout@v4

      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Assert DEV-RESET preamble is commented
        # The only DROP SCHEMA in the file is the preamble; it MUST stay
        # commented in git (an uncommented one would wipe whatever DB a
        # programmatic/CI/staging/prod load runs against). Checked BEFORE the
        # load so a destructive line never even touches the CI database.
        run: |
          if grep -nEi '^[[:space:]]*DROP[[:space:]]+SCHEMA' "$SCHEMA"; then
            echo "::error::Uncommented DROP SCHEMA found in $SCHEMA — must stay commented in git."
            exit 1
          fi
          echo "DEV-RESET preamble is commented."

      - name: Load schema.sql into fresh empty Postgres
        run: psql "$PGURL" -v ON_ERROR_STOP=1 -f "$SCHEMA"

      - name: Assert table count == 45
        run: |
          count=$(psql "$PGURL" -tAc "SELECT count(*) FROM information_schema.tables WHERE table_schema='public' AND table_type='BASE TABLE';")
          echo "Loaded $count base tables (expected $EXPECTED_TABLES)."
          if [ "$count" != "$EXPECTED_TABLES" ]; then
            echo "::error::Expected $EXPECTED_TABLES tables, loaded $count."
            exit 1
          fi

  check:
    # Compile / lint / format gate — mirrors the monorepo's mobile-ci shape.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
